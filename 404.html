<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · James Cai</title>
    <meta name="description" content="Page not found. Head back to the James Cai portfolio home page.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Scroll reveal hides content only when JS can bring it back (.js .fade-up) -->
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>

    <header class="header" id="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">James Cai<span class="logo-dot">.</span></a>
                <nav class="nav-menu" id="navMenu" aria-label="Main navigation">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="works.html">Works</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
                <a href="contact.html" class="nav-cta">Start a Project</a>
                <button class="mobile-menu-btn" id="mobileBtn" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- 404 -->
    <main>
        <div class="page-hero fade-up">
            <div class="container">
                <p class="section-eyebrow">Error 404</p>
                <h1>Page Not Found</h1>
                <p>The page you are looking for does not exist or has moved.</p>
                <div class="hero-actions">
                    <a href="index.html" class="btn btn-primary">Back to Home</a>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <span class="footer-logo">James Cai<span class="logo-dot">.</span></span>
                    <p>Video Editor / Motion Graphics Designer</p>
                </div>
                <nav class="footer-nav" aria-label="Footer navigation">
                    <a href="index.html">Home</a>
                    <a href="works.html">Works</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <div class="footer-social">
                    <a href="https://instagram.com" aria-label="Instagram">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
                    </a>
                    <a href="https://youtube.com" aria-label="YouTube">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 7a3 3 0 0 1 3-3h13a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-13a3 3 0 0 1-3-3V7z"/><polygon points="10 9 15.5 12 10 15 10 9" fill="currentColor" stroke="none"/></svg>
                    </a>
                    <a href="https://tiktok.com" aria-label="TikTok">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 3.5v10.1a4.4 4.4 0 1 1-4.4-4.4"/><path d="M13.5 3.5c.4 3 2.9 5.3 6 5.6"/></svg>
                    </a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 James Cai. All rights reserved.</p>
                <a href="contact.html" class="footer-cta">Start a Project →</a>
            </div>
        </div>
    </footer>

    <script>
    // Header scroll state
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => header.classList.toggle('scrolled', window.scrollY > 40), { passive: true });

    // Mobile menu: open instantly, close with a short exit before the panel drops
    const mobileBtn = document.getElementById('mobileBtn');
    const navMenu   = document.getElementById('navMenu');
    let menuClosing = false;

    function openMenu() {
        navMenu.classList.remove('closing');
        navMenu.classList.add('active');
        mobileBtn.classList.add('active');
        mobileBtn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
        if (!navMenu.classList.contains('active') || menuClosing) return;
        menuClosing = true;
        mobileBtn.classList.remove('active');
        mobileBtn.setAttribute('aria-expanded', 'false');
        navMenu.classList.add('closing');
        setTimeout(() => {
            navMenu.classList.remove('active', 'closing');
            menuClosing = false;
        }, 160); // --dur-exit: keep in sync with the nav-close keyframe
    }

    mobileBtn.addEventListener('click', () => {
        if (menuClosing) return;
        navMenu.classList.contains('active') ? closeMenu() : openMenu();
    });
    navMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

    // Scroll reveal
    const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
    setTimeout(() => {
        document.querySelectorAll('.fade-up').forEach(el => {
            if (el.getBoundingClientRect().top < window.innerHeight - 40) el.classList.add('visible');
        });
    }, 80);
    </script>
</body>
</html>
